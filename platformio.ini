[platformio]
default_envs = blink_base

[env]
platform = atmelavr
board = uno
upload_port = /dev/ttyUSB0
monitor_speed = 9600

[env:blink_base]
build_src_filter = -<*> +<blink/base/>

[env:blink_pwm]
build_src_filter = -<*> +<blink/pwm/>

[env:blink_mixed]
build_src_filter = -<*> +<blink/mixed/>

[env:morse_basic]
build_src_filter = -<*> +<morse/basic/>

[env:morse_uart]
build_src_filter = -<*> +<morse/uart/>

[env:temperature]
framework = arduino
build_src_filter = -<*> +<sensors/temperature/>

[env:potential]
framework = arduino
build_src_filter = -<*> +<sensors/potential/>

[env:light]
framework = arduino
build_src_filter = -<*> +<sensors/light/>